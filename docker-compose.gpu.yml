services:
  subgen:
    container_name: subgen
    image: mccloud/subgen:latest
    restart: unless-stopped
    mem_limit: 20g
    memswap_limit: 20g
    pids_limit: 512
    cpus: 6.0
    gpus: all
    ports:
      - "${SUBGEN_BIND_ADDRESS:-0.0.0.0}:9000:9000"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1001}
      - WEBHOOK_PORT=9000
      - SUBGEN_API_KEY=${SUBGEN_API_KEY:-}
      - HTTP_TIMEOUT_SECONDS=30
      - TRANSCRIBE_DEVICE=cuda
      - WHISPER_MODEL=large-v3
      - COMPUTE_TYPE=float16
      - CONCURRENT_TRANSCRIPTIONS=1
      - WHISPER_THREADS=6
      - TRANSCRIBE_FOLDERS=/media/PlexFilmsHD|/media/PlexFilms|/media/PlexTVHD|/media/PlexTV
      - MONITOR=True
      - PROCESS_ADDED_MEDIA=True
      - PROCESS_MEDIA_ON_PLAY=False
      - MODEL_PATH=/subgen/models
      - TRANSCRIBE_OR_TRANSLATE=translate
      - SUBTITLE_LANGUAGE_NAME=en
      - SUBTITLE_LANGUAGE_NAMING_TYPE=ISO_639_1
      - SHOULD_WHISPER_DETECT_AUDIO_LANGUAGE=True
      - NOTIFY_ON_ENGLISH_AUDIO_MISMATCH=True
      - SKIP_IF_TARGET_SUBTITLES_EXIST=True
      - SKIP_IF_EXTERNAL_SUBTITLES_EXIST=True
      - CLEAR_VRAM_ON_COMPLETE=True
      - MODEL_CLEANUP_DELAY=900
      - SKIP_VIDEO_EXTENSIONS=.avi
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DEBUG=False
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/media
      - ${SUBGEN_MODEL_PATH:-/opt/subgen/models}:/subgen/models
      - ./subgen_override.py:/subgen/subgen.py:ro
      - ./language_code.py:/subgen/language_code.py:ro
    stop_grace_period: 2m
