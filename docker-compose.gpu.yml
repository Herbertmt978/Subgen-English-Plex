services:
  subgen:
    container_name: subgen
    image: ${SUBGEN_IMAGE:-ghcr.io/herbertmt978/subgen-english-plex:v0.5.0}
    restart: unless-stopped
    mem_limit: ${SUBGEN_MEMORY_LIMIT:-10g}
    memswap_limit: ${SUBGEN_MEMORY_LIMIT:-10g}
    pids_limit: 512
    cpus: ${SUBGEN_CPU_LIMIT:-4.0}
    gpus: all
    ports:
      - "${SUBGEN_BIND_ADDRESS:-127.0.0.1}:9000:9000"
    environment:
      - PUID=${PUID:-1000}
      - PGID=${PGID:-1000}
      - WEBHOOK_PORT=9000
      - SUBGEN_API_KEY=${SUBGEN_API_KEY:-}
      - HTTP_TIMEOUT_SECONDS=30
      - TRANSCRIBE_DEVICE=cuda
      - WHISPER_MODEL=${WHISPER_MODEL:-auto}
      - SEGMENTATION_ENABLED=${SEGMENTATION_ENABLED:-True}
      - SEGMENTATION_CHUNK_MINUTES=${SEGMENTATION_CHUNK_MINUTES:-auto}
      - MEMORY_PRESSURE_YIELD=${MEMORY_PRESSURE_YIELD:-True}
      - MEMORY_PRESSURE_RESERVE_GIB=${MEMORY_PRESSURE_RESERVE_GIB:-auto}
      - GPU_MEMORY_RESERVE_GIB=${GPU_MEMORY_RESERVE_GIB:-auto}
      - CANONICAL_SHARED_CUDA=${CANONICAL_SHARED_CUDA:-False}
      - MODEL_ENVELOPE_CATALOG=${MODEL_ENVELOPE_CATALOG:-/opt/subgen/model-envelopes/catalog.json}
      - MODEL_ENVELOPE_IDENTITY=${MODEL_ENVELOPE_IDENTITY:-/opt/subgen/model-envelopes/image-identity.json}
      - COMPUTE_TYPE=float16
      - CONCURRENT_TRANSCRIPTIONS=1
      - WHISPER_THREADS=${WHISPER_THREADS:-4}
      - TRANSCRIBE_FOLDERS=${TRANSCRIBE_FOLDERS:-/media/Movies|/media/TV}
      - SKIP_STARTUP_SCAN=${SKIP_STARTUP_SCAN:-False}
      - MONITOR=True
      - PROCESS_ADDED_MEDIA=True
      - PROCESS_MEDIA_ON_PLAY=False
      - MODEL_PATH=/subgen/models
      - TRANSCRIBE_OR_TRANSLATE=translate
      - SUBTITLE_LANGUAGE_NAME=en
      - SUBTITLE_LANGUAGE_NAMING_TYPE=ISO_639_1
      - SHOULD_WHISPER_DETECT_AUDIO_LANGUAGE=True
      - NOTIFY_ON_ENGLISH_AUDIO_MISMATCH=True
      - SKIP_IF_TARGET_SUBTITLES_EXIST=True
      - SKIP_IF_EXTERNAL_SUBTITLES_EXIST=True
      - SKIP_MARKED_FAILED_FILES=${SKIP_MARKED_FAILED_FILES:-true}
      - SUBGEN_FAILURE_MARKER_PATH=/opt/subgen/monitor/subgen_failure_markers.json
      - CLEAR_VRAM_ON_COMPLETE=True
      - MODEL_CLEANUP_DELAY=${MODEL_CLEANUP_DELAY:-300}
      - SKIP_VIDEO_EXTENSIONS=.avi
      - PLEX_SERVER=${PLEX_SERVER:-}
      - PLEX_TOKEN=${PLEX_TOKEN:-}
      - USE_PATH_MAPPING=${USE_PATH_MAPPING:-False}
      - PATH_MAPPING_FROM=${PATH_MAPPING_FROM:-}
      - PATH_MAPPING_TO=${PATH_MAPPING_TO:-}
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility
      - DEBUG=False
    volumes:
      - ${MEDIA_ROOT:-/srv/media}:/media
      - ${SUBGEN_MODEL_PATH:-./models}:/subgen/models
      - ${SUBGEN_STATE_DIR:-./monitor}:/opt/subgen/monitor:ro
    stop_grace_period: 2m
